name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm run unit-test

    - name: Build project
      run: npm run build

    # dist/ is gitignored on main, but `uses: owner/repo@tag` needs the bundle
    # in the tagged tree. Commit it on a detached release commit, move the tag
    # (and the floating major tag, e.g. v1) onto it. Pushes made with
    # GITHUB_TOKEN don't trigger workflows, so this can't loop.
    - name: Commit bundle to release tag
      run: |
        TAG="${GITHUB_REF_NAME}"
        MAJOR="${TAG%%.*}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f dist
        git commit -m "release: ${TAG}"
        git tag -f "${TAG}"
        git tag -f "${MAJOR}"
        git push -f origin "refs/tags/${TAG}" "refs/tags/${MAJOR}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
