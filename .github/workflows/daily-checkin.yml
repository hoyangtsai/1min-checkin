name: 1min.ai Daily Auto Checkin

on:
  schedule:
    # Run daily at UTC 8:00 (Taipei time 16:00)
    - cron: '5 8 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # needed by the keepalive step

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run auto checkin
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: node dist/index.js


    # GitHub disables scheduled workflows in public repos after 60 days
    # without repository activity. Re-enabling via the API resets that timer.
    - name: Keepalive
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-checkin.yml/enable"
